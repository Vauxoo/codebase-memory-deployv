[pytest]
norecursedirs =
    .git
    .tox
    .env
    dist
    build
    migrations
    test_repo

python_files =
    test_*.py
    *_test.py
    tests.py
addopts =
    -ra
    --strict-markers
    --ignore=docs/conf.py
    --ignore=setup.py
    --ignore=ci
    --ignore=.eggs
    --doctest-modules
    --doctest-glob=\*.rst
    --tb=short
    --pyargs
# testpaths comes after addopts so codebase_memory_deployv is interpreted as --pyargs codebase_memory_deployv.
# Tests inside src/ ship with the package so any user can run: pytest --pyargs codebase_memory_deployv
testpaths =
    ./src/codebase_memory_deployv
    ./tests

# Idea from: https://til.simonwillison.net/pytest/treat-warnings-as-errors
filterwarnings =
    error
